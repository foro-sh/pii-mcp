name: Release

# Runs on every push to main. Own concurrency group (not keyed on github.ref)
# so a release run is never cancelled mid-push — a half-pushed tag/changelog
# commit is the worst outcome. PR-time commitlint lives in ci.yml, which
# cancels stale runs instead (that's the right behavior there, wrong here).
#
# Commitlint is a blocking first step: a non-conventional pushed commit fails
# the job before semantic-release runs. When a release is cut, publish-python
# uploads the matching wheel/sdist to PyPI via OIDC trusted publishing.
on:
  push:
    branches: [main]

permissions:
  contents: write # create tags/releases and push the changelog commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # OIDC for PyPI trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic-release.outputs.published }}
      version: ${{ steps.semantic-release.outputs.version }}
      sha: ${{ steps.released-commit.outputs.sha }}
    steps:
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit analysis sees every commit
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch / no prior ref — lint just the tip (HEAD~1 does not
            # exist on the first commit of an empty repo).
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

      # GITHUB_TOKEN is the app-token step's output, not the default
      # secrets.GITHUB_TOKEN — the default token can't push past main's
      # branch protection once it is enabled.
      #
      # `published` / `version` are written by scripts/record-release.sh via
      # the exec plugin's successCmd — `pnpm release` sets no outputs itself.
      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm release

      # The release commit is created and pushed by @semantic-release/git, so
      # local HEAD now carries the bumped pyproject.toml. The publish job
      # builds this exact commit rather than a branch name, which would
      # otherwise race with anything landing on main in the meantime.
      - name: Record released commit
        id: released-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # These steps duplicate publish-python.yml rather than calling it. PyPI's
  # trusted publishing cannot authorize an upload that runs inside a reusable
  # workflow, so `uses:` is not available here — the upload has to sit in the
  # workflow that PyPI is configured to trust. publish-python.yml stays as the
  # manual recovery path; both files need a trusted publisher on PyPI.
  publish-python:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
