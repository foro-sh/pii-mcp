name: Release

# Runs on every push to main. Own concurrency group (not keyed on github.ref)
# so a release run is never cancelled mid-push — a half-pushed tag/changelog
# commit is the worst outcome. PR-time commitlint lives in ci.yml, which
# cancels stale runs instead (that's the right behavior there, wrong here).
#
# Commitlint is a blocking first step: a non-conventional pushed commit fails
# the job before semantic-release runs. When a release is cut, platform wheels
# (maturin) plus a pure-Python wheel/sdist (hatchling) upload to PyPI via OIDC,
# and the TypeScript package publishes to npm (JS-only; napi prebuilds later).
#
# npm allows exactly one trusted-publisher workflow filename per package, and
# it resolves the *calling* workflow — so this file is the only one that can
# ever authenticate an npm publish. Manual recovery therefore has to be
# dispatched from here rather than from publish-typescript.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Republish the npm package from this ref, without cutting a release.
        type: boolean
        default: false

permissions:
  contents: write # create tags/releases and push the changelog commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # OIDC for PyPI and npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic-release.outputs.published }}
      version: ${{ steps.semantic-release.outputs.version }}
      sha: ${{ steps.released-commit.outputs.sha }}
    steps:
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit analysis sees every commit
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch / no prior ref — lint just the tip (HEAD~1 does not
            # exist on the first commit of an empty repo).
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

      # GITHUB_TOKEN is the app-token step's output, not the default
      # secrets.GITHUB_TOKEN — the default token can't push past main's
      # branch protection once it is enabled.
      #
      # `published` / `version` are written by scripts/record-release.sh via
      # the exec plugin's successCmd — `pnpm release` sets no outputs itself.
      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm release

      # The release commit is created and pushed by @semantic-release/git, so
      # local HEAD now carries the bumped pyproject.toml. Publish jobs build
      # this exact commit rather than a branch name, which would otherwise
      # race with anything landing on main in the meantime.
      - name: Record released commit
        id: released-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Platform wheels with pii_mcp._native. Duplicated in publish-python.yml
  # rather than shared via workflow_call — PyPI trusted publishing cannot
  # authorize uploads that run inside a reusable workflow.
  build-wheels:
    name: Build wheels (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            test: true
          - os: ubuntu-latest
            target: aarch64
            test: false # cross-compiled on x86_64 runners
          - os: macos-15-intel
            target: x86_64
            test: true
          - os: macos-14
            target: aarch64
            test: true
          - os: windows-latest
            target: x64
            test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
          maturin-version: v1.15.0
      - name: Smoke-test wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --verbose dist/*.whl
          python -c "from pii_mcp import using_native, scrub_text; assert using_native(); assert scrub_text('a@b.co')['found']"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # Pure py3-none-any wheel + sdist (hatchling). Fallback when no platform
  # wheel matches, or when the installer forces --no-binary.
  build-sdist:
    name: Build sdist + pure wheel
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: dist

  publish-python:
    name: Publish to PyPI
    needs: [release, build-wheels, build-sdist]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  # npm's trusted publishing resolves the *calling* workflow's filename, not
  # the one holding the publish step — the opposite of PyPI — and npm allows
  # only one such filename per package. So every npm publish, automatic or
  # manual, has to be called from this file for the publisher to match.
  #
  # Two ways in:
  #   - a release was cut on push
  #   - someone dispatched this workflow with publish_npm (recovery)
  #
  # `always()` is needed because the release job is skipped entirely on a
  # dispatch, and a skipped dependency would otherwise skip this job too.
  # needs.release.result is checked explicitly so a *failed* release still
  # blocks the automatic arm. Pattern from foro-sh/foro.
  publish-typescript:
    name: Publish to npm
    needs: release
    if: >-
      always() && (
        (needs.release.result == 'success'
          && needs.release.outputs.published == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-typescript.yml
    with:
      # Empty on a dispatch, which makes the called workflow check out the
      # dispatched ref — main's head, already carrying the version bump.
      ref: ${{ needs.release.outputs.sha }}
