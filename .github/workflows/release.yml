name: Release

# Runs on every push to main. Own concurrency group (not keyed on github.ref)
# so a release run is never cancelled mid-push — a half-pushed tag/changelog
# commit is the worst outcome. PR-time commitlint lives in ci.yml, which
# cancels stale runs instead (that's the right behavior there, wrong here).
#
# Commitlint is a blocking first step: a non-conventional pushed commit fails
# the job before semantic-release runs. When a release is cut, platform wheels
# (maturin) plus a pure-Python wheel/sdist (hatchling) upload to PyPI via OIDC,
# and the TypeScript package publishes to npm (JS-only; napi prebuilds later).
on:
  push:
    branches: [main]

permissions:
  contents: write # create tags/releases and push the changelog commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # OIDC for PyPI trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic-release.outputs.published }}
      version: ${{ steps.semantic-release.outputs.version }}
      sha: ${{ steps.released-commit.outputs.sha }}
    steps:
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit analysis sees every commit
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch / no prior ref — lint just the tip (HEAD~1 does not
            # exist on the first commit of an empty repo).
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

      # GITHUB_TOKEN is the app-token step's output, not the default
      # secrets.GITHUB_TOKEN — the default token can't push past main's
      # branch protection once it is enabled.
      #
      # `published` / `version` are written by scripts/record-release.sh via
      # the exec plugin's successCmd — `pnpm release` sets no outputs itself.
      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm release

      # The release commit is created and pushed by @semantic-release/git, so
      # local HEAD now carries the bumped pyproject.toml. Publish jobs build
      # this exact commit rather than a branch name, which would otherwise
      # race with anything landing on main in the meantime.
      - name: Record released commit
        id: released-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Platform wheels with pii_mcp._native. Duplicated in publish-python.yml
  # rather than shared via workflow_call — PyPI trusted publishing cannot
  # authorize uploads that run inside a reusable workflow.
  build-wheels:
    name: Build wheels (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            test: true
          - os: ubuntu-latest
            target: aarch64
            test: false # cross-compiled on x86_64 runners
          - os: macos-15-intel
            target: x86_64
            test: true
          - os: macos-14
            target: aarch64
            test: true
          - os: windows-latest
            target: x64
            test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
          maturin-version: v1.15.0
      - name: Smoke-test wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --verbose dist/*.whl
          python -c "from pii_mcp import using_native, scrub_text; assert using_native(); assert scrub_text('a@b.co')['found']"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # Pure py3-none-any wheel + sdist (hatchling). Fallback when no platform
  # wheel matches, or when the installer forces --no-binary.
  build-sdist:
    name: Build sdist + pure wheel
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: dist

  publish-python:
    name: Publish to PyPI
    needs: [release, build-wheels, build-sdist]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  # JS-only TypeScript package (native napi prebuilds are out of scope for now).
  # Duplicated in publish-npm.yml for the same trusted-publisher reason as PyPI.
  publish-npm:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: typescript
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # Trusted publishing needs npm >= 11.5.1; do not set NODE_AUTH_TOKEN or
      # setup-node registry-url (that writes an empty _authToken and blocks OIDC).
      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public
