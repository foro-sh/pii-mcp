name: Release

# Runs on every push to main. Own concurrency group (not keyed on github.ref)
# so a release run is never cancelled mid-push — a half-pushed tag/changelog
# commit is the worst outcome. PR-time commitlint lives in ci.yml, which
# cancels stale runs instead (that's the right behavior there, wrong here).
#
# Commitlint is a blocking first step: a non-conventional pushed commit fails
# the job before semantic-release runs. No build here — semantic-release only
# writes the changelog, tags, and publishes a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write # create tags/releases and push the changelog commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit analysis sees every commit
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch / no prior ref — lint just the tip (HEAD~1 does not
            # exist on the first commit of an empty repo).
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

      # GITHUB_TOKEN is the app-token step's output, not the default
      # secrets.GITHUB_TOKEN — the default token can't push past main's
      # branch protection once it is enabled.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm release
