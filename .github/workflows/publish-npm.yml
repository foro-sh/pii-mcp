name: Publish npm

# Manual and recovery publishes only — the automatic publish on merge is a job
# in release.yml. npm trusted publishing authorizes by workflow filename, so
# this file needs its own trusted publisher entry (same pattern as PyPI).
#
# Dispatching builds the branch head, which after a release is the commit
# carrying the version bump.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public
