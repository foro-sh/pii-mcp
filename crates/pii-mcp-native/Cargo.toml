[package]
name = "pii-mcp-native"
version = "1.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional PyO3 bindings for pii-core"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pii-core = { workspace = true, features = ["payload"] }
pyo3 = { workspace = true }
serde_json = { workspace = true }
