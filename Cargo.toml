[workspace]
resolver = "2"
members = ["crates/pii-core", "crates/pii-mcp-native", "crates/pii-mcp-napi"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/foro-sh/pii-mcp"

[workspace.dependencies]
pii-core = { path = "crates/pii-core" }
regex = "1"
serde_json = "1"
thiserror = "2"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2"
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
